stages:
  # ── Range-Doppler pipeline (feature/range-doppler-2d) ─────────────────────
  # Data is generated on-the-fly in src/train.py — no separate generate stage.

  train:
    cmd: PYTHONPATH=. python src/train.py
    deps:
      - src/train.py
      - src/data/generator.py
      - src/model/cnn_lstm.py
      - params.yaml
    params:
      - rd_data
      - rd_model
      - rd_training
    outs:
      - artifacts/model_best.pt
    metrics:
      - artifacts/metrics.json:
          cache: false

  export:
    cmd: PYTHONPATH=. python scripts/export_onnx_rd.py
    deps:
      - scripts/export_onnx_rd.py
      - src/model/cnn_lstm.py
      - artifacts/model_best.pt
      - params.yaml
    params:
      - onnx
      - rd_model
    outs:
      - artifacts/model.onnx
