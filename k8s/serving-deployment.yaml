# The ONNX model is NOT served from a Kubernetes pod.
#
# After promotion to Production in the MLflow Registry, the ONNX artifact is
# pulled and deployed directly onto the radar signal processor hardware:
#
#   - Embedded Linux targets: ONNX Runtime (onnxruntime-linux-x64)
#   - FPGA targets: Xilinx Vitis AI compilation from the same .onnx file
#
# The hardware node runs inference locally — no network hop, no cluster dependency.
# Deployment is handled by the platform integration team, not the MLOps pipeline.
