# Secret manifest template — DO NOT commit real values.
#
# In production, use Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets)
# or HashiCorp Vault with the Vault Agent Injector. The pattern below shows the
# structure; actual values are injected by the deployment pipeline or manually
# by the cluster administrator.
#
# Create from the command line (values never touch the repo):
#   kubectl create secret generic mlflow-credentials \
#     --namespace ml-training \
#     --from-literal=tracking-uri=http://mlflow-server:5000
#
#   kubectl create secret generic dvc-remote-credentials \
#     --namespace ml-training \
#     --from-literal=access-key-id=AKIAIOSFODNN7EXAMPLE \
#     --from-literal=secret-access-key=<your-key>
#
# The base64 values below are placeholders — replace before applying.
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-credentials
  namespace: ml-training
type: Opaque
data:
  # echo -n 'http://mlflow-server:5000' | base64
  tracking-uri: aHR0cDovL21sZmxvdy1zZXJ2ZXI6NTAwMA==
---
apiVersion: v1
kind: Secret
metadata:
  name: dvc-remote-credentials
  namespace: ml-training
type: Opaque
data:
  # Populate with your artifact store credentials (S3-compatible or NFS)
  access-key-id: REPLACE_WITH_BASE64
  secret-access-key: REPLACE_WITH_BASE64
