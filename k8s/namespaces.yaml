---
# Namespace isolation — workloads are separated by function.
# Training Jobs run in ml-training; monitoring scrapes ml-training but cannot modify it.
# Inference runs directly on the radar signal processor hardware — no serving namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: ml-training
  labels:
    purpose: model-training
    managed-by: kubectl
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    purpose: observability
    managed-by: kubectl
