apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar-inference
  labels:
    app: radar-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: radar-inference
  template:
    metadata:
      labels:
        app: radar-inference
    spec:
      containers:
        - name: radar-inference
          image: YOUR_REGISTRY/weibel-radar:latest  # replace with your registry
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
