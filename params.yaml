# params.yaml — single source of truth for all pipeline parameters
data:
  n_samples: 5000
  signal_length: 128
  snr_range: [5.0, 20.0]       # dB, target SNR range
  clutter_ratio: 0.5            # fraction of clutter samples
  noise_seed: 42
  val_split: 0.2

model:
  hidden_dims: [128, 64]
  dropout: 0.1
  use_fft: true          # project to frequency domain before MLP

training:
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  baseline_accuracy: 0.80      # CI gate — pipeline fails below this

onnx:
  opset_version: 17
  model_path: "artifacts/model.onnx"