name: ML Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # ── Setup ────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Code quality ─────────────────────────────────────────────────────────
      - name: Lint (ruff)
        run: python -m ruff check .

      # ── Unit tests ───────────────────────────────────────────────────────────
      - name: Unit tests (pytest)
        run: pytest tests/ -v

      # ── Data generation ──────────────────────────────────────────────────────
      - name: Generate synthetic radar data
        run: PYTHONPATH=. python src/data/generate.py

      # ── Training ─────────────────────────────────────────────────────────────
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ./mlruns
        run: PYTHONPATH=. python src/training/train.py

      # ── ONNX export ───────────────────────────────────────────────────────────
      - name: Export ONNX model
        env:
          MLFLOW_TRACKING_URI: ./mlruns
        run: PYTHONPATH=. python scripts/export_onnx.py

      # ── ONNX validation ───────────────────────────────────────────────────────
      - name: Validate ONNX model runs end-to-end
        run: PYTHONPATH=. python src/inference/validate_onnx.py

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/model_best.pt
            artifacts/model.onnx
            artifacts/metrics.json
          retention-days: 30
