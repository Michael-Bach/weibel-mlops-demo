name: ML Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # ── Setup ────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # ── Code quality ─────────────────────────────────────────────────────────
      - name: Lint (ruff)
        run: python -m ruff check .

      # ── Unit tests ───────────────────────────────────────────────────────────
      - name: Unit tests (pytest)
        run: pytest tests/ -v

      # ── Training (CNN) ───────────────────────────────────────────────────────
      - name: Train CNN detector
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow_ci.db
        run: PYTHONPATH=. python src/train_ppi.py params_ppi.yaml

      # ── ONNX export ───────────────────────────────────────────────────────────
      - name: Export CNN to ONNX
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow_ci.db
        run: PYTHONPATH=. python scripts/export_onnx_ppi.py

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/ppi_model_best.pt
            artifacts/ppi_model.onnx
            artifacts/ppi_metrics.json
          retention-days: 30
