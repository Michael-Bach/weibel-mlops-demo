name: ML Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Unit tests (pytest)
        run: pytest tests/ -v

      - name: Generate synthetic radar data
        run: PYTHONPATH=. python src/data/generate.py

      - name: Train model
        run: PYTHONPATH=. python src/training/train.py

      - name: Evaluate — enforce accuracy baseline
        run: |
          python - <<'EOF'
          import json, sys
          with open("artifacts/metrics.json") as f:
              metrics = json.load(f)
          acc = metrics["val_accuracy"]
          baseline = 0.80
          print(f"val_accuracy: {acc:.4f}  baseline: {baseline}")
          if acc < baseline:
              print(f"FAILED: {acc:.4f} < {baseline}")
              sys.exit(1)
          print("PASSED")
          EOF

      - name: Export ONNX model
        run: PYTHONPATH=. python scripts/export_onnx.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/model_best.pt
            artifacts/model.onnx
            artifacts/metrics.json
          retention-days: 30
